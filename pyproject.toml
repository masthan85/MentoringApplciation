# Virtual uv workspace root. Each member has its own pyproject.toml.
[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4"]
ignore = ["S101"]  # asserts are fine in tests; src code does not rely on them

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
