[project]
name = "mentor-worker"
version = "0.1.0"
description = "Adaptive AI mentoring platform: background worker"
requires-python = ">=3.12"
dependencies = [
  "mentor-api",
  "arq>=0.26",
]

[tool.uv.sources]
mentor-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["worker"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true
