[project]
name = "mentor-api"
version = "0.1.0"
description = "Adaptive AI mentoring platform: API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "openai>=1.50",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "cryptography>=50.0.2",
  "arq>=0.28.0",
  "email-validator>=2.3.0",
  "pypdf>=6.20.1",
  "pgvector>=0.5.1",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis>=2.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a running Postgres (see infra/postgres)"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "arq.*", "sentence_transformers.*"]
ignore_missing_imports = true
