# Local development stack. Run from the repository root:
#   docker compose -f infra/docker-compose.yml up --build
name: mentor

x-python-env: &python-env
  ENV: local
  AUTH_MODE: dev
  DATABASE_URL: postgresql+asyncpg://mentor_app:mentor_app@postgres:5432/mentor
  MIGRATION_DATABASE_URL: postgresql+asyncpg://mentor:mentor@postgres:5432/mentor
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: '["http://localhost:3000"]'
  # Set real keys in .env to use real models; without them the mock provider answers.
  LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates roles and the mentor / mentor_test databases on first start.
      - ./postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./postgres/02-databases.sh:/docker-entrypoint-initdb.d/02-databases.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: .., dockerfile: infra/docker/python.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: infra/docker/python.Dockerfile }
    environment: *python-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: { context: .., dockerfile: infra/docker/python.Dockerfile }
    working_dir: /srv/apps/worker
    command: ["arq", "worker.main.WorkerSettings"]
    environment: *python-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
